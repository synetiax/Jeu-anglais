<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Anglais">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🌟 Apprends l'anglais! 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-light: #a8e6cf;
            --green-main: #56ab2f;
            --green-dark: #2d5016;
            --yellow: #ffd93d;
            --pink: #ff6b9d;
            --purple: #a55eea;
            --blue: #45aaf2;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255,255,255,0.95);
            --shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Fredoka', sans-serif; background: var(--bg-gradient); min-height: 100vh; }
        
        .user-selection { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-gradient); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .user-selection.hidden { display: none; }
        .user-selection-card { background: var(--card-bg); border-radius: 30px; padding: 40px; text-align: center; max-width: 500px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
        .user-selection h2 { font-size: 2rem; color: var(--green-dark); margin-bottom: 10px; }
        .user-selection p { color: #666; margin-bottom: 30px; }
        .user-profiles { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .user-profile-btn { display: flex; align-items: center; gap: 15px; background: white; border: 3px solid #e0e0e0; border-radius: 20px; padding: 20px; cursor: pointer; transition: all 0.2s ease; font-family: 'Fredoka', sans-serif; text-align: left; }
        .user-profile-btn:hover { border-color: var(--purple); transform: translateX(5px); }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .user-avatar.avatar-1 { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
        .user-avatar.avatar-2 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .user-avatar.avatar-3 { background: linear-gradient(135deg, #d4fc79, #96e6a1); }
        .user-avatar.avatar-4 { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
        .user-info { flex: 1; }
        .user-name { font-size: 1.3rem; font-weight: 600; color: #333; }
        .user-progress-mini { font-size: 0.9rem; color: #888; margin-top: 3px; }
        .user-delete-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.4; padding: 10px; }
        .user-delete-btn:hover { opacity: 1; }
        .add-user-section { border-top: 2px dashed #e0e0e0; padding-top: 25px; margin-top: 10px; }
        .add-user-form { display: none; flex-direction: column; gap: 15px; }
        .add-user-form.active { display: flex; }
        .add-user-input { padding: 15px 20px; border: 3px solid #e0e0e0; border-radius: 15px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; text-align: center; }
        .add-user-input:focus { outline: none; border-color: var(--purple); }
        .avatar-selector { display: flex; gap: 10px; justify-content: center; }
        .avatar-option { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
        .avatar-option:hover { transform: scale(1.1); }
        .avatar-option.selected { border-color: var(--purple); transform: scale(1.15); }
        .add-user-btn { background: linear-gradient(135deg, var(--green-main), #2d8a1e); color: white; border: none; padding: 15px 30px; border-radius: 25px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .add-user-btn:hover { transform: scale(1.05); }
        .add-user-btn.secondary { background: #e0e0e0; color: #333; }
        .show-add-form-btn { background: none; border: 3px dashed #ccc; border-radius: 20px; padding: 20px; width: 100%; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; color: #888; cursor: pointer; }
        .show-add-form-btn:hover { border-color: var(--purple); color: var(--purple); }
        
        .current-user-bar { background: var(--card-bg); border-radius: 15px; padding: 12px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 15px rgba(0,0,0,0.1); }
        .current-user-info { display: flex; align-items: center; gap: 12px; }
        .current-user-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .current-user-name { font-weight: 600; color: #333; }
        .reset-user-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.5; padding: 5px; border-radius: 50%; }
        .reset-user-btn:hover { opacity: 1; background: #fee; }
        .switch-user-btn { background: #f0f0f0; border: none; padding: 8px 16px; border-radius: 10px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem; cursor: pointer; }
        .switch-user-btn:hover { background: #e0e0e0; }
        
        .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
        .bubble { position: absolute; bottom: -100px; background: rgba(255,255,255,0.1); border-radius: 50%; animation: rise 15s infinite ease-in; }
        .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 35%; width: 50px; height: 50px; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 50%; width: 30px; height: 30px; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 65%; width: 25px; height: 25px; animation-delay: 3s; }
        .bubble:nth-child(6) { left: 80%; width: 45px; height: 45px; animation-delay: 5s; }
        @keyframes rise { 0% { transform: translateY(0) rotate(0deg); opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        
        .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 20px; color: white; }
        header h1 { font-size: 2.5rem; font-weight: 700; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); margin-bottom: 10px; }
        
        .progress-overview { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow); }
        .progress-title { font-size: 1.3rem; font-weight: 600; color: var(--green-dark); margin-bottom: 15px; }
        .progress-bar-container { background: #e0e0e0; border-radius: 15px; height: 30px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--green-main), var(--yellow)); border-radius: 15px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; min-width: 40px; }
        .progress-text { color: white; font-weight: 600; font-size: 0.9rem; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
        .stars-display { display: flex; gap: 5px; justify-content: center; font-size: 2rem; }
        .star { opacity: 0.3; }
        .star.earned { opacity: 1; }
        
        .path-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .path-item { background: var(--card-bg); border-radius: 20px; padding: 20px 25px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; border: 3px solid transparent; position: relative; overflow: hidden; }
        .path-item::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 8px; }
        .path-item.category::before { background: var(--blue); }
        .path-item.revision::before { background: var(--purple); }
        .path-item.current { border-color: var(--purple); animation: pulse 2s ease infinite; }
        .path-item.locked { opacity: 0.5; }
        .path-item.completed { border-color: var(--green-main); }
        .path-item.completed::after { content: '✓'; position: absolute; top: 10px; right: 15px; background: var(--green-main); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.2), 0 0 0 0 rgba(165, 94, 234, 0.4); } 50% { box-shadow: 0 10px 40px rgba(0,0,0,0.2), 0 0 0 15px rgba(165, 94, 234, 0); } }
        .path-icon { font-size: 2.5rem; flex-shrink: 0; }
        .path-info { flex: 1; }
        .path-letter { font-size: 0.9rem; color: #888; font-weight: 600; margin-bottom: 3px; }
        .path-name { font-size: 1.2rem; font-weight: 600; color: #333; margin-bottom: 5px; }
        .path-status { font-size: 0.9rem; color: #888; }
        .path-btn { background: linear-gradient(135deg, var(--green-main), #2d8a1e); color: white; border: none; padding: 15px 30px; border-radius: 25px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        .path-btn:hover { transform: scale(1.05); }
        .path-btn.locked { background: #ccc; cursor: not-allowed; }
        .path-btn.locked:hover { transform: none; }
        
        .game-area { background: var(--card-bg); border-radius: 25px; padding: 30px; box-shadow: var(--shadow); display: none; }
        .game-area.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .game-title { font-size: 1.5rem; font-weight: 600; color: var(--green-dark); }
        .game-level { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; padding: 8px 20px; border-radius: 25px; font-weight: 600; }
        .back-btn { background: #f0f0f0; border: none; padding: 12px 25px; border-radius: 15px; font-family: 'Fredoka', sans-serif; font-size: 1rem; cursor: pointer; }
        .back-btn:hover { background: #e0e0e0; }
        
        .matching-container { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin: 30px 0; }
        .matching-column { display: flex; flex-direction: column; gap: 12px; min-width: 200px; }
        .matching-column h3 { text-align: center; color: #666; font-size: 1rem; margin-bottom: 10px; }
        .match-item { background: white; border: 3px solid #e0e0e0; border-radius: 15px; padding: 15px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; text-align: center; user-select: none; }
        .match-item:hover:not(.matched) { border-color: var(--blue); transform: scale(1.02); }
        .match-item.selected { border-color: var(--purple); background: #f0e6ff; transform: scale(1.05); }
        .match-item.matched { border-color: var(--green-main); background: var(--green-light); cursor: default; }
        .match-item.wrong { animation: shake 0.5s ease; border-color: #ff6b6b; background: #ffe0e0; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        .score-display { text-align: center; padding: 20px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 20px; margin-top: 25px; border: 3px solid #dee2e6; }
        .score-row { display: flex; justify-content: center; gap: 40px; }
        .score-item { text-align: center; }
        .score-label { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        .score-item .score-value { font-size: 2.5rem; font-weight: 700; color: var(--green-main); }
        .score-item.errors .score-value { color: #ff6b6b; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 30px; padding: 40px; text-align: center; max-width: 400px; width: 100%; animation: modalPop 0.3s ease; }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-icon { font-size: 5rem; margin-bottom: 20px; }
        .modal h2 { font-size: 2rem; color: var(--green-dark); margin-bottom: 15px; }
        .modal p { color: #666; font-size: 1.1rem; margin-bottom: 25px; }
        .modal-stars { font-size: 3rem; margin-bottom: 25px; }
        .modal-btn { background: linear-gradient(135deg, var(--green-main), #2d8a1e); color: white; border: none; padding: 15px 40px; border-radius: 25px; font-family: 'Fredoka', sans-serif; font-size: 1.2rem; font-weight: 600; cursor: pointer; margin: 5px; }
        .modal-btn:hover { transform: scale(1.05); }
        .modal-btn.secondary { background: #e0e0e0; color: #333; }
        
        .instructions { background: #f8f4ff; padding: 15px 20px; border-radius: 15px; margin-bottom: 20px; color: #666; font-size: 1rem; text-align: center; }
        .instructions strong { color: var(--purple); }
        
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .matching-container { flex-direction: column; }
            .matching-column { width: 100%; }
            .game-header { flex-direction: column; text-align: center; }
            .path-item { flex-direction: column; text-align: center; }
            .path-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="user-selection" id="userSelection">
        <div class="user-selection-card">
            <h2>👋 Qui joue?</h2>
            <p>Choisis ton profil pour continuer</p>
            <div class="user-profiles" id="userProfiles"></div>
            <div class="add-user-section">
                <button class="show-add-form-btn" id="showAddFormBtn" onclick="showAddUserForm()">➕ Ajouter un joueur</button>
                <div class="add-user-form" id="addUserForm">
                    <input type="text" class="add-user-input" id="newUserName" placeholder="Ton prénom" maxlength="20">
                    <div class="avatar-selector" id="avatarSelector">
                        <div class="avatar-option avatar-1 selected" data-avatar="1" onclick="selectAvatar(1)">🦋</div>
                        <div class="avatar-option avatar-2" data-avatar="2" onclick="selectAvatar(2)">🌟</div>
                        <div class="avatar-option avatar-3" data-avatar="3" onclick="selectAvatar(3)">🌸</div>
                        <div class="avatar-option avatar-4" data-avatar="4" onclick="selectAvatar(4)">🦄</div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="add-user-btn secondary" onclick="hideAddUserForm()" style="flex:1">Annuler</button>
                        <button class="add-user-btn" onclick="createUser()" style="flex:1">Créer</button>
                    </div>
                </div>
            </div>
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px dashed #ddd;">
                <div style="font-size: 0.9rem; color: #888; margin-bottom: 10px;">💾 Sauvegarde</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="exportProgress()" style="background: #f0f0f0; border: none; padding: 10px 20px; border-radius: 10px; font-family: Fredoka; cursor: pointer;">📤 Exporter</button>
                    <button onclick="document.getElementById('importFile').click()" style="background: #f0f0f0; border: none; padding: 10px 20px; border-radius: 10px; font-family: Fredoka; cursor: pointer;">📥 Importer</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
                </div>
            </div>
        </div>
    </div>
    
    <div class="bubbles"><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div></div>
    
    <div class="container">
        <header><h1>🌟 Apprends l'anglais! 🌟</h1><p style="font-size: 1.1rem; opacity: 0.9;">Useful Language</p></header>
        
        <div class="current-user-bar" id="currentUserBar">
            <div class="current-user-info">
                <div class="current-user-avatar avatar-1" id="currentUserAvatar">🦋</div>
                <span class="current-user-name" id="currentUserName">Joueur</span>
                <button class="reset-user-btn" onclick="resetProgress()" title="Réinitialiser">🔄</button>
            </div>
            <button class="switch-user-btn" onclick="showUserSelection()">Changer</button>
        </div>
        
        <div class="progress-overview" id="progressOverview">
            <div class="progress-title">📊 Ma progression</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="globalProgress" style="width: 5%"><span class="progress-text" id="globalProgressText">0%</span></div>
            </div>
            <div class="stars-display" id="globalStars"></div>
        </div>
        
        <div class="path-container" id="pathContainer"></div>
        
        <div class="game-area" id="gameArea">
            <div class="game-header">
                <button class="back-btn" onclick="goBack()">← Retour</button>
                <h2 class="game-title" id="gameTitle">Section</h2>
                <div class="game-level" id="gameLevel">Niveau 1</div>
            </div>
            <div class="instructions" id="gameInstructions"></div>
            <div id="gameContent"></div>
            <div class="score-display">
                <div class="score-row">
                    <div class="score-item"><div class="score-label">✓ Bonnes réponses</div><div class="score-value" id="scoreValue">0</div></div>
                    <div class="score-item errors"><div class="score-label">✗ Erreurs</div><div class="score-value" id="errorsValue">0</div></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <h2 id="modalTitle">Bravo!</h2>
            <p id="modalMessage">Tu as terminé!</p>
            <div class="modal-stars" id="modalStars"></div>
            <button class="modal-btn" id="modalNextBtn">Continuer →</button>
            <button class="modal-btn secondary" onclick="closeModal()">Menu</button>
        </div>
    </div>
    
    <script>
        const sectionsData = {
            greetings: { nameFr: "Salutations", icon: "👋", pairs: [
                { en: "Good morning", fr: "Bonjour (matin)" },
                { en: "Good afternoon", fr: "Bonjour (après-midi)" },
                { en: "Hi, my name is {NAME}", fr: "Salut, je m'appelle {NAME}" },
                { en: "Hello, I'm {NAME}", fr: "Bonjour, je suis {NAME}" },
                { en: "How are you today", fr: "Comment vas-tu aujourd'hui" },
                { en: "I'm fine, thank you", fr: "Je vais bien, merci" },
                { en: "This is my friend {NAME}", fr: "C'est mon ami(e) {NAME}" },
                { en: "Hi, nice to meet you", fr: "Salut, enchanté(e)" },
                { en: "See you later", fr: "À plus tard" },
                { en: "Goodbye", fr: "Au revoir" },
                { en: "Bye", fr: "Salut / Bye" }
            ]},
            polite: { nameFr: "Être poli", icon: "🙏", pairs: [
                { en: "Excuse me", fr: "Excusez-moi" },
                { en: "I'm sorry", fr: "Je suis désolé(e)" },
                { en: "Thank you", fr: "Merci" },
                { en: "Thanks", fr: "Merci" },
                { en: "Thank you very much", fr: "Merci beaucoup" },
                { en: "You're welcome", fr: "De rien" },
                { en: "Please", fr: "S'il te plaît" }
            ]},
            opinions: { nameFr: "Opinions", icon: "💭", pairs: [
                { en: "Do you agree", fr: "Es-tu d'accord" },
                { en: "I agree", fr: "Je suis d'accord" },
                { en: "I think you're right", fr: "Je pense que tu as raison" },
                { en: "That's right", fr: "C'est vrai" },
                { en: "I don't agree", fr: "Je ne suis pas d'accord" },
                { en: "I disagree", fr: "Je ne suis pas d'accord" },
                { en: "I think you're wrong", fr: "Je pense que tu as tort" },
                { en: "I don't think so", fr: "Je ne pense pas" },
                { en: "What do you think", fr: "Qu'est-ce que tu penses" },
                { en: "I think that...", fr: "Je pense que..." },
                { en: "What's your opinion", fr: "Quelle est ton opinion" },
                { en: "In my opinion...", fr: "À mon avis..." }
            ]},
            clarification: { nameFr: "Clarification", icon: "❓", pairs: [
                { en: "I don't understand", fr: "Je ne comprends pas" },
                { en: "I don't know", fr: "Je ne sais pas" },
                { en: "Can you repeat please", fr: "Peux-tu répéter s'il te plaît" },
                { en: "How do you say that in English", fr: "Comment dit-on ça en anglais" },
                { en: "How do you spell that", fr: "Comment ça s'épelle" },
                { en: "What does that mean", fr: "Qu'est-ce que ça veut dire" },
                { en: "It means...", fr: "Ça veut dire..." }
            ]},
            help: { nameFr: "Aide", icon: "🆘", pairs: [
                { en: "Can you help me please", fr: "Peux-tu m'aider s'il te plaît" },
                { en: "Can I help you", fr: "Puis-je t'aider" },
                { en: "I need help", fr: "J'ai besoin d'aide" },
                { en: "Help me please", fr: "Aide-moi s'il te plaît" }
            ]},
            permissions: { nameFr: "Permissions", icon: "✋", pairs: [
                { en: "Can I speak French", fr: "Puis-je parler français" },
                { en: "May I go to the washroom", fr: "Puis-je aller aux toilettes" },
                { en: "Can I go drink please", fr: "Puis-je aller boire" },
                { en: "Can I borrow your pencil", fr: "Puis-je emprunter ton crayon" },
                { en: "Can I turn on the light", fr: "Puis-je allumer la lumière" },
                { en: "Can I go get my snack", fr: "Puis-je aller chercher ma collation" }
            ]},
            teamwork: { nameFr: "Travail d'équipe", icon: "🤝", pairs: [
                { en: "Whose turn is it", fr: "C'est à qui le tour" },
                { en: "It's my turn", fr: "C'est mon tour" },
                { en: "It's your turn", fr: "C'est ton tour" },
                { en: "Do you want to work with me", fr: "Veux-tu travailler avec moi" },
                { en: "Good job!", fr: "Bon travail / Bravo" }
            ]}
        };
        
        const sectionOrder = ['greetings', 'polite', 'opinions', 'clarification', 'help', 'permissions', 'teamwork'];
        const sectionLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
        const avatarEmojis = ['🦋', '🌟', '🌸', '🦄'];
        
        function buildPath() {
            const path = [];
            for (let i = 0; i < sectionOrder.length; i++) {
                path.push({ type: 'category', sectionIndex: i, sectionId: sectionOrder[i], letter: sectionLetters[i] });
                if (i >= 1) {
                    path.push({ type: 'revision', upToIndex: i, letters: sectionLetters.slice(0, i + 1).join('+') });
                }
            }
            return path;
        }
        const gamePath = buildPath();
        
        let appState = { users: [], currentUserId: null };
        let gameState = { progress: {}, currentPathIndex: 0, currentLevel: 1, score: 0, totalPairs: 0, matchedPairs: 0, errors: 0, errorPairs: [], selectedItem: null, isRevision: false, isCategory: false, maxLevel: 1, currentSectionId: null };
        let selectedAvatar = 1;
        
        function loadAppState() { const saved = localStorage.getItem('englishGameAppV3'); if (saved) appState = JSON.parse(saved); }
        function saveAppState() { localStorage.setItem('englishGameAppV3', JSON.stringify(appState)); }
        
        function exportProgress() {
            const dataStr = JSON.stringify(appState, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'anglais-sauvegarde.json';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ Sauvegarde exportée!');
        }
        
        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.users) {
                        appState = data;
                        saveAppState();
                        renderUserProfiles();
                        alert('✅ Progression restaurée!');
                    }
                } catch (err) { alert('❌ Fichier invalide.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function renderUserProfiles() {
            const container = document.getElementById('userProfiles');
            container.innerHTML = '';
            appState.users.forEach(user => {
                const progress = Math.round(((user.progress.completedPaths || []).length / gamePath.length) * 100);
                const div = document.createElement('div');
                div.className = 'user-profile-btn';
                div.innerHTML = '<div class="user-avatar avatar-' + user.avatar + '">' + avatarEmojis[user.avatar - 1] + '</div><div class="user-info"><div class="user-name">' + user.name + '</div><div class="user-progress-mini">Progression: ' + progress + '%</div></div><button class="user-delete-btn" onclick="event.stopPropagation(); deleteUser(\'' + user.id + '\')" title="Supprimer">🗑️</button>';
                div.onclick = () => selectUser(user.id);
                container.appendChild(div);
            });
            if (appState.users.length === 0) container.innerHTML = '<p style="color: #888; padding: 20px;">Aucun joueur. Crée ton profil!</p>';
        }
        
        function showAddUserForm() { document.getElementById('showAddFormBtn').style.display = 'none'; document.getElementById('addUserForm').classList.add('active'); document.getElementById('newUserName').focus(); }
        function hideAddUserForm() { document.getElementById('showAddFormBtn').style.display = 'block'; document.getElementById('addUserForm').classList.remove('active'); document.getElementById('newUserName').value = ''; selectAvatar(1); }
        function selectAvatar(num) { selectedAvatar = num; document.querySelectorAll('.avatar-option').forEach(el => el.classList.toggle('selected', el.dataset.avatar == num)); }
        
        function createUser() {
            const name = document.getElementById('newUserName').value.trim();
            if (!name) { alert('Entre ton prénom!'); return; }
            const newUser = { id: 'user_' + Date.now(), name: name, avatar: selectedAvatar, progress: { currentPathIndex: 0, currentLevel: 1, completedPaths: [], stars: {} } };
            appState.users.push(newUser);
            saveAppState();
            hideAddUserForm();
            selectUser(newUser.id);
        }
        
        function deleteUser(userId) {
            const user = appState.users.find(u => u.id === userId);
            if (confirm('Supprimer ' + user.name + '?')) {
                appState.users = appState.users.filter(u => u.id !== userId);
                if (appState.currentUserId === userId) appState.currentUserId = null;
                saveAppState();
                renderUserProfiles();
            }
        }
        
        function selectUser(userId) {
            const user = appState.users.find(u => u.id === userId);
            if (!user) return;
            appState.currentUserId = userId;
            saveAppState();
            gameState.progress = user.progress;
            document.getElementById('currentUserName').textContent = user.name;
            document.getElementById('currentUserAvatar').className = 'current-user-avatar avatar-' + user.avatar;
            document.getElementById('currentUserAvatar').textContent = avatarEmojis[user.avatar - 1];
            document.getElementById('userSelection').classList.add('hidden');
            init();
        }
        
        function showUserSelection() { renderUserProfiles(); document.getElementById('userSelection').classList.remove('hidden'); }
        function getCurrentUser() { return appState.users.find(u => u.id === appState.currentUserId); }
        function personalizePairs(pairs) {
            const user = getCurrentUser();
            const name = user ? user.name : 'Emma';
            return pairs.map(p => ({ en: p.en.replace(/{NAME}/g, name), fr: p.fr.replace(/{NAME}/g, name) }));
        }
        
        function init() { renderPath(); updateGlobalProgress(); }
        function saveProgress() { const user = getCurrentUser(); if (user) { user.progress = gameState.progress; saveAppState(); } }
        function resetProgress() {
            if (confirm('Recommencer à zéro?')) {
                const user = getCurrentUser();
                if (user) {
                    user.progress = { currentPathIndex: 0, currentLevel: 1, completedPaths: [], stars: {} };
                    gameState.progress = user.progress;
                    saveAppState();
                    init();
                }
            }
        }
        
        function renderPath() {
            const container = document.getElementById('pathContainer');
            container.innerHTML = '';
            const currentPathIndex = gameState.progress.currentPathIndex || 0;
            const completedPaths = gameState.progress.completedPaths || [];
            
            gamePath.forEach((item, index) => {
                const isCompleted = completedPaths.includes(index);
                const isCurrent = index === currentPathIndex;
                const isLocked = index > currentPathIndex;
                
                const div = document.createElement('div');
                div.className = 'path-item ' + item.type + (isCompleted ? ' completed' : '') + (isCurrent ? ' current' : '') + (isLocked ? ' locked' : '');
                
                let icon, letter, name, status, btnText;
                if (item.type === 'category') {
                    const section = sectionsData[item.sectionId];
                    icon = section.icon;
                    letter = 'Catégorie ' + item.letter;
                    name = section.nameFr;
                    status = isCompleted ? '✓ Terminé' : (isCurrent ? 'En cours' : '🔒');
                    btnText = isCurrent ? 'Jouer ▶' : (isCompleted ? 'Refaire' : '🔒');
                } else {
                    icon = '🎯';
                    letter = 'Révision';
                    name = 'Catégories ' + item.letters;
                    status = isCompleted ? '✓ Terminé' : (isCurrent ? 'Prêt!' : '🔒');
                    btnText = isCurrent ? 'Jouer ▶' : (isCompleted ? 'Refaire' : '🔒');
                }
                
                div.innerHTML = '<div class="path-icon">' + icon + '</div><div class="path-info"><div class="path-letter">' + letter + '</div><div class="path-name">' + name + '</div><div class="path-status">' + status + '</div></div><button class="path-btn' + (isLocked ? ' locked' : '') + '"' + (isLocked ? ' disabled' : '') + '>' + btnText + '</button>';
                
                if (!isLocked) div.querySelector('.path-btn').onclick = (e) => { e.stopPropagation(); startPathItem(index); };
                container.appendChild(div);
            });
        }
        
        function updateGlobalProgress() {
            const completedPaths = gameState.progress.completedPaths || [];
            const percent = Math.round((completedPaths.length / gamePath.length) * 100);
            document.getElementById('globalProgress').style.width = Math.max(percent, 5) + '%';
            document.getElementById('globalProgressText').textContent = percent + '%';
            const starsCount = Math.min(7, Math.floor((percent / 100) * 7));
            let starsHtml = '';
            for (let i = 0; i < 7; i++) starsHtml += '<span class="star' + (i < starsCount ? ' earned' : '') + '">⭐</span>';
            document.getElementById('globalStars').innerHTML = starsHtml;
        }
        
        function startPathItem(pathIndex) {
            const item = gamePath[pathIndex];
            gameState.currentPathIndex = pathIndex;
            gameState.isRevision = false;
            const isCurrent = pathIndex === gameState.progress.currentPathIndex;
            
            if (item.type === 'category') {
                const section = sectionsData[item.sectionId];
                const currentLevel = isCurrent ? (gameState.progress.currentLevel || 1) : 1;
                const levelPairs = personalizePairs(section.pairs.slice(0, currentLevel));
                
                document.getElementById('pathContainer').style.display = 'none';
                document.getElementById('progressOverview').style.display = 'none';
                document.getElementById('gameArea').classList.add('active');
                document.getElementById('gameTitle').textContent = section.icon + ' ' + section.nameFr;
                document.getElementById('gameLevel').textContent = 'Catégorie ' + item.letter;
                document.getElementById('gameInstructions').innerHTML = '<strong>Associe</strong> chaque expression anglaise avec sa traduction française!';
                
                gameState.currentLevel = currentLevel;
                gameState.maxLevel = section.pairs.length;
                gameState.currentSectionId = item.sectionId;
                gameState.isCategory = true;
                startGame(levelPairs);
            } else {
                const sectionsToInclude = sectionOrder.slice(0, item.upToIndex + 1);
                let allPairs = [];
                sectionsToInclude.forEach(sid => { allPairs = allPairs.concat(sectionsData[sid].pairs); });
                allPairs = shuffleArray(personalizePairs(allPairs)).slice(0, 12);
                
                document.getElementById('pathContainer').style.display = 'none';
                document.getElementById('progressOverview').style.display = 'none';
                document.getElementById('gameArea').classList.add('active');
                document.getElementById('gameTitle').textContent = '🎯 Révision ' + item.letters;
                document.getElementById('gameLevel').textContent = allPairs.length + ' expressions';
                document.getElementById('gameInstructions').innerHTML = '<strong>Révision!</strong> Associe les expressions de toutes les catégories!';
                
                gameState.isCategory = false;
                startGame(allPairs);
            }
        }
        
        function startGame(pairs) {
            gameState.score = 0;
            gameState.totalPairs = pairs.length;
            gameState.matchedPairs = 0;
            gameState.errors = 0;
            gameState.errorPairs = [];
            gameState.selectedItem = null;
            gameState.currentPairs = pairs;
            document.getElementById('scoreValue').textContent = '0';
            document.getElementById('errorsValue').textContent = '0';
            renderMatchingGame(pairs);
        }
        
        function renderMatchingGame(pairs) {
            const shuffledEn = shuffleArray([...pairs]);
            const shuffledFr = shuffleArray([...pairs]);
            document.getElementById('gameContent').innerHTML = '<div class="matching-container"><div class="matching-column"><h3>🇬🇧 English</h3>' + shuffledEn.map((p, i) => '<div class="match-item" data-type="en" data-id="' + pairs.indexOf(p) + '" onclick="selectMatchItem(this)">' + p.en + '</div>').join('') + '</div><div class="matching-column"><h3>🇫🇷 Français</h3>' + shuffledFr.map((p, i) => '<div class="match-item" data-type="fr" data-id="' + pairs.indexOf(p) + '" onclick="selectMatchItem(this)">' + p.fr + '</div>').join('') + '</div></div>';
        }
        
        function selectMatchItem(element) {
            if (element.classList.contains('matched')) return;
            const type = element.dataset.type;
            const id = parseInt(element.dataset.id);
            
            if (gameState.selectedItem && gameState.selectedItem.type === type) {
                gameState.selectedItem.element.classList.remove('selected');
                gameState.selectedItem = { element, type, id };
                element.classList.add('selected');
                return;
            }
            
            if (!gameState.selectedItem) {
                gameState.selectedItem = { element, type, id };
                element.classList.add('selected');
                return;
            }
            
            const selectedPair = gameState.currentPairs[gameState.selectedItem.id];
            const clickedPair = gameState.currentPairs[id];
            let isMatch = gameState.selectedItem.id === id || selectedPair.fr === clickedPair.fr;
            
            if (isMatch) {
                gameState.selectedItem.element.classList.remove('selected');
                gameState.selectedItem.element.classList.add('matched');
                element.classList.add('matched');
                gameState.matchedPairs++;
                document.getElementById('scoreValue').textContent = gameState.matchedPairs;
                gameState.selectedItem = null;
                if (gameState.matchedPairs === gameState.totalPairs) setTimeout(endGame, 500);
            } else {
                const prev = gameState.selectedItem.element;
                element.classList.add('wrong');
                prev.classList.add('wrong');
                prev.classList.remove('selected');
                gameState.errors++;
                document.getElementById('errorsValue').textContent = gameState.errors;
                if (!gameState.errorPairs.find(p => p.en === selectedPair.en)) gameState.errorPairs.push(selectedPair);
                if (!gameState.errorPairs.find(p => p.en === clickedPair.en)) gameState.errorPairs.push(clickedPair);
                gameState.selectedItem = null;
                setTimeout(() => { element.classList.remove('wrong'); prev.classList.remove('wrong'); }, 600);
            }
        }
        
        function endGame() {
            const accuracy = Math.max(0, Math.round(100 - (gameState.errors / gameState.totalPairs) * 100));
            let stars = accuracy >= 90 ? 3 : (accuracy >= 70 ? 2 : (accuracy >= 50 ? 1 : 0));
            gameState.originalStars = stars;
            
            const modal = document.getElementById('resultModal');
            const nextBtn = document.getElementById('modalNextBtn');
            let icon, title, message;
            
            if (gameState.isRevision) {
                if (gameState.errorPairs.length === 0) {
                    icon = '🌟'; title = 'Super!'; message = 'Erreurs corrigées!';
                    completeCurrentLevel();
                    document.getElementById('modalStars').innerHTML = renderStars(stars, 3);
                    nextBtn.textContent = 'Continuer →';
                    nextBtn.onclick = continueToNext;
                } else {
                    icon = '📝'; title = 'Continue!'; message = gameState.errorPairs.length + ' expression(s) à revoir';
                    document.getElementById('modalStars').innerHTML = '';
                    nextBtn.textContent = '📝 Continuer';
                    nextBtn.onclick = startErrorRevision;
                }
            } else {
                icon = stars === 3 ? '🏆' : (stars >= 2 ? '🎉' : (stars >= 1 ? '💪' : '📚'));
                title = stars === 3 ? 'Parfait!' : (stars >= 2 ? 'Bravo!' : (stars >= 1 ? 'Pas mal!' : 'Continue!'));
                message = accuracy + '% de réussite';
                document.getElementById('modalStars').innerHTML = renderStars(stars, 3);
                
                if (gameState.errorPairs.length > 0) {
                    nextBtn.textContent = '📝 Réviser mes erreurs';
                    nextBtn.onclick = startErrorRevision;
                } else {
                    completeCurrentLevel();
                    nextBtn.textContent = 'Continuer →';
                    nextBtn.onclick = continueToNext;
                }
            }
            
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modal.classList.add('active');
        }
        
        function completeCurrentLevel() {
            const pathIndex = gameState.currentPathIndex;
            if (gameState.isCategory) {
                if (gameState.currentLevel >= gameState.maxLevel) {
                    if (!gameState.progress.completedPaths.includes(pathIndex)) gameState.progress.completedPaths.push(pathIndex);
                    gameState.progress.currentPathIndex = pathIndex + 1;
                    gameState.progress.currentLevel = 1;
                } else {
                    gameState.progress.currentLevel = gameState.currentLevel + 1;
                }
            } else {
                if (!gameState.progress.completedPaths.includes(pathIndex)) gameState.progress.completedPaths.push(pathIndex);
                gameState.progress.currentPathIndex = pathIndex + 1;
                gameState.progress.currentLevel = 1;
            }
            saveProgress();
        }
        
        function startErrorRevision() {
            document.getElementById('resultModal').classList.remove('active');
            gameState.isRevision = true;
            const pairs = [...gameState.errorPairs];
            document.getElementById('gameTitle').textContent = '📝 Révision';
            document.getElementById('gameLevel').textContent = pairs.length + ' à revoir';
            document.getElementById('gameInstructions').innerHTML = '<strong>Révise</strong> les expressions manquées!';
            startGame(pairs);
        }
        
        function continueToNext() {
            document.getElementById('resultModal').classList.remove('active');
            gameState.isRevision = false;
            const currentPathIndex = gameState.progress.currentPathIndex;
            
            if (currentPathIndex >= gamePath.length) {
                alert('🎉 Félicitations! Tu as terminé tout le jeu!');
                goBack();
                return;
            }
            
            if (gameState.isCategory && gameState.currentLevel < gameState.maxLevel) {
                startPathItem(gameState.currentPathIndex);
            } else {
                startPathItem(currentPathIndex);
            }
        }
        
        function closeModal() { document.getElementById('resultModal').classList.remove('active'); goBack(); }
        function goBack() {
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('pathContainer').style.display = 'flex';
            document.getElementById('progressOverview').style.display = 'block';
            renderPath();
            updateGlobalProgress();
        }
        
        function renderStars(earned, total) {
            let html = '';
            for (let i = 0; i < total; i++) html += '<span class="star' + (i < earned ? ' earned' : '') + '">⭐</span>';
            return html;
        }
        
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
            return arr;
        }
        
        loadAppState();
        if (appState.currentUserId && appState.users.find(u => u.id === appState.currentUserId)) selectUser(appState.currentUserId);
        else renderUserProfiles();
    </script>
</body>
</html>
